name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Triggers when you push to the 'main' branch

concurrency:
  group: deploy-ec2
  cancel-in-progress: true


jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            # 1. Go into the project directory
            cd College-Resource-Sharing-System
            
            # 2. Pull the latest code from GitHub main branch
            rm -f .git/*.lock .git/refs/heads/*.lock .git/refs/remotes/origin/*.lock || true
            git fetch origin --prune
            git reset --hard origin/main
            git clean -fdx -e .env

            # 2.5 Ensure the EC2 instance has a Swap file so npm install/build doesn't crash it
            if [ $(sudo swapon --show | wc -l) -eq 0 ]; then
              echo "No swap file found. Creating a 2GB swap file to prevent out-of-memory errors..."
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo "/swapfile swap swap defaults 0 0" | sudo tee -a /etc/fstab
            else
              echo "Swap file already exists."
            fi

            # 3. Export variables from your existing .env file to preserve your HTTPS/Domain setup
            export $(grep -v '^#' .env | xargs)

            # 3.5 Build the new Docker images in the background (zero downtime during this 3-minute step)
            docker compose -f docker-compose.prod.yml build backend frontend

            # 3.8 Stop and remove old containers, then clean up old Docker build cache and unused images
            docker compose -f docker-compose.prod.yml down --remove-orphans -t 5 || true
            docker rm -f $(docker ps -aq --filter "name=crss_") 2>/dev/null || true
            docker rm -f crss_db crss_redis crss_backend crss_celery_worker crss_celery_beat crss_frontend crss_db_backup 2>/dev/null || true
            docker system prune -af || true
            docker builder prune -af || true

            # 5. Start the new production containers without attempting concurrent rebuilds
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans --no-build
