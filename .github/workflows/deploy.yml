name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          UPLOAD_DIR: ./uploads
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            # 1. Go into the project directory
            cd College-Resource-Sharing-System

            # 2. Pull the latest code from GitHub main branch
            rm -f .git/*.lock .git/refs/heads/*.lock .git/refs/remotes/origin/*.lock || true
            git fetch origin --prune
            git reset --hard origin/main
            git clean -fdx -e .env

            # 2.5 Ensure the EC2 instance has a Swap file so npm install/build doesn't crash it
            if [ $(sudo swapon --show | wc -l) -eq 0 ]; then
              echo "No swap file found. Creating a 2GB swap file to prevent out-of-memory errors..."
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo "/swapfile swap swap defaults 0 0" | sudo tee -a /etc/fstab
            else
              echo "Swap file already exists."
            fi

            # 3. Export variables from your existing .env file to preserve your HTTPS/Domain setup
            export $(grep -v '^#' .env | xargs)

            # 3.5 Build the new Docker images in the background (zero downtime during this 3-minute step)
            docker compose -f docker-compose.prod.yml build backend frontend

            # 3.8 Stop and remove old containers
            docker compose -f docker-compose.prod.yml down --remove-orphans -t 5 || true
            docker rm -f $(docker ps -aq --filter "name=crss_") 2>/dev/null || true
            docker rm -f crss_db crss_redis crss_backend crss_celery_worker crss_celery_beat crss_frontend crss_db_backup 2>/dev/null || true

            # 5. Start the new production containers without attempting concurrent rebuilds
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans --no-build

            # 6. Clean up old Docker build cache and unused images now that the new ones are running
            docker system prune -af || true
            docker builder prune -af || true
