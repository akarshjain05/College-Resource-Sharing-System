# Standalone production compose file for a single VM (e.g. AWS EC2).
#
# Deliberately NOT a partial override of docker-compose.yml: Compose merges list-typed
# fields (volumes, ports) by CONCATENATION across -f files, not replacement, so trying
# to "clear" the dev bind-mounts via an override would silently fail to remove them.
# This file is self-contained instead, so what you read here is exactly what runs.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: crss_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - crss_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - internal

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: crss_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - internal

  backend:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    image: crss_backend:latest
    pull_policy: never
    container_name: crss_backend
    restart: unless-stopped
    command: sh -c "python prestart.py && gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      BACKEND_CORS_ORIGINS: '["https://${DOMAIN}"]'
    volumes:
      - crss_uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external

  celery_worker:
    logging: *default-logging
    image: crss_backend:latest
    pull_policy: never
    container_name: crss_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    volumes:
      - crss_uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external

  celery_beat:
    logging: *default-logging
    image: crss_backend:latest
    pull_policy: never
    container_name: crss_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    logging: *default-logging
    image: crss_frontend_prod:latest
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      network: host
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: crss_frontend
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-13-48-123-128.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - backend
    networks:
      - internal
      - external

  db_backup:
    logging: *default-logging
    image: prodrigestivill/postgres-backup-local
    container_name: crss_db_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - crss_db_backups:/backups
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  crss_postgres_data:
  crss_uploads:
  caddy_data:
  caddy_config:
  crss_db_backups:

networks:
  internal:
    internal: true
  external:
